hardware:
  device: "auto"
  num_cpu_threads: 8
  vram_limit_mb: 3600
  pin_memory: true

training:
  steps_per_conv: 4
  base_lr_correction: 2.0e-2
  base_lr_ssl: 1.0e-2
  gradient_clip_norm: 1.0
  max_seq_len: 128
  max_step_drift: 0.25
  scgp_top_k: 128
  subspace_suppression: 0.90
  frobenius_clip_rho: 0.5
  lambda_step_reg: 1.0e-4
  lambda_global_reg: 1.0e-5
  simpo_margin: 0.5
  preference_weight_mu: 1.0
  min_confidence_alpha: 0.1
  max_confidence_alpha: 1.0
  master_dtype: "float32"
  compute_dtype: "float32"

evaluation:
  fast_probe_budget_sec: 25.0
  eval_probe_sample_limit: 50
  eval_checkpoints: [0, 50, 100]

paths:
  runs_dir: "experiments/scale_5arch_15gb/runs"
  reports_dir: "experiments/scale_5arch_15gb/reports"
  data_slices_dir: "experiments/scale_5arch_15gb/data_slices"
  manifests_dir: "experiments/scale_5arch_15gb/data_manifests"
